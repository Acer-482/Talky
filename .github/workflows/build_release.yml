name: Build and Release Flutter App

on:
  push:
    tags:
      - "v*" # 监听标签推送事件
  workflow_dispatch: # 允许手动触发

jobs:
  # 构建网页端
  build-web:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v6

      # 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true
          cache-key: flutter-stable-3.35.1-web

      # 安装并生成 shared 包代码
      - name: Install shared deps
        working-directory: shared
        run: flutter pub get

      - name: Generate shared code
        working-directory: shared
        run: dart run build_runner build --delete-conflicting-outputs

      # 安装并生成 client 代码
      - name: Install client deps
        working-directory: client
        run: flutter pub get

      - name: Generate client code
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      # 构建 Web 端
      - name: Build Web
        working-directory: client
        run: flutter build web --release

      # 打包 Web 产物
      - name: Package Web Build
        run: |
          cd client/build/web
          zip -r ../../../web-build.zip .
          cd ../../..

      # 上传 Web 产物
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: web-build.zip

  # 构建桌面客户端 - Windows / Linux
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build-cmd: windows
            artifact-name: windows-build
            package-cmd: Compress-Archive -Path "client/build/windows/x64/runner/Release/*" -DestinationPath "windows-build.zip" -Force
          - os: ubuntu-latest
            build-cmd: linux
            artifact-name: linux-build
            package-cmd: tar -czf linux-build.tar.gz -C client/build/linux/x64/release/bundle .

    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v6

      # 安装 Linux 编译依赖
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      # 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true
          cache-key: flutter-stable-3.35.1-${{ matrix.os }}

      # 安装并生成 shared 包代码
      - name: Install shared deps
        working-directory: shared
        run: flutter pub get

      - name: Generate shared code
        working-directory: shared
        run: dart run build_runner build --delete-conflicting-outputs

      # 安装并生成 client 代码
      - name: Install client deps
        working-directory: client
        run: flutter pub get

      - name: Generate client code
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      # 构建桌面应用
      - name: Build Desktop App
        working-directory: client
        run: flutter build ${{ matrix.build-cmd }} --release

      # 打包桌面应用
      - name: Package Desktop Build
        run: ${{ matrix.package-cmd }}

      # 上传产物
      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.*

  # 创建Release & 上传产物
  create-release:
    runs-on: ubuntu-latest
    needs: [build-web, build-desktop]
    permissions:
      contents: write

    steps:
      # 下载 Web 产物
      - name: Download Web Artifact
        uses: actions/download-artifact@v5
        with:
          name: web-build
          path: artifacts/web/

      # 下载 Windows 桌面产物
      - name: Download Windows Artifact
        uses: actions/download-artifact@v5
        with:
          name: windows-build
          path: artifacts/desktop/windows-build/

      # 下载 Linux 桌面产物
      - name: Download Linux Artifact
        uses: actions/download-artifact@v5
        with:
          name: linux-build
          path: artifacts/desktop/linux-build/

      # 列出所有下载文件（便于排查）
      - name: List generated files
        run: |
          echo "=== Web Build ==="
          find artifacts/web -type f | while read file; do
            echo "- $(basename "$file") - $(du -h "$file" | cut -f1)"
          done
          echo "=== Desktop Builds ==="
          find artifacts/desktop -type f | while read file; do
            echo "- $(basename "$file") - $(du -h "$file" | cut -f1)"
          done

      # 创建 Release 并上传所有产物
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/web/web-build.zip
            artifacts/desktop/windows-build/windows-build.zip
            artifacts/desktop/linux-build/linux-build.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Talky 构建产物

            ### 网页端
            - **web-build.zip** - 解压后部署到任意 Web 服务器（Nginx / Apache / 静态托管）
              - 建议开启 gzip 压缩
              - 配置 SPA 回退规则，将所有请求指向 `index.html`

            ### 桌面应用
            - **windows-build.zip** - Windows x64，解压后运行 `talky_client.exe`
            - **linux-build.tar.gz** - Linux x64，解压后运行 `talky_client`

            ### 部署提示
            - Web 端首次加载建议通过 Nginx 开启 gzip / brotli 压缩
            - Windows 客户端需要确保 `flutter_windows.dll` 与 exe 在同一目录
            - Linux 客户端需具备 GTK3 运行环境
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}