name: Build and Release Flutter App

on:
  push:
    tags:
      - "v*" # 监听标签推送事件
  workflow_dispatch: # 允许手动触发

jobs:
  # 构建网页端
  build-web:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v7

      # 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
          cache-key: flutter-stable-3.47.6-web

      # 安装并生成 shared 包代码
      - name: Install shared deps
        working-directory: shared
        run: flutter pub get

      - name: Generate shared code
        working-directory: shared
        run: dart run build_runner build --delete-conflicting-outputs
      
      # 动态生成客户端.env文件
      - name: Create .env file
        working-directory: client
        run: |
          mkdir -p assets
          echo "${{ secrets.CLIENT_DOTENV }}" > assets/.env
        shell: bash

      # 安装并生成 client 代码
      - name: Install client deps
        working-directory: client
        run: flutter pub get

      - name: Generate client code
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      # 构建 Web 端
      - name: Build Web
        working-directory: client
        run: flutter build web --release

      # 打包 Web 产物
      - name: Package Web Build
        run: |
          cd client/build/web
          zip -r ../../../web-build.zip .
          cd ../../..

      # 上传 Web 产物
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web-build.zip

  # 构建桌面客户端 - Windows / Linux
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build-cmd: windows
            artifact-name: windows-build
            package-cmd: Compress-Archive -Path "client/build/windows/x64/runner/Release/*" -DestinationPath "windows-build.zip" -Force
          - os: ubuntu-latest
            build-cmd: linux
            artifact-name: linux-build
            package-cmd: tar -czf linux-build.tar.gz -C client/build/linux/x64/release/bundle .

    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v7

      # 安装 Linux 编译依赖
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      # 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
          cache-key: flutter-stable-3.47.6-${{ matrix.os }}

      # 安装并生成 shared 包代码
      - name: Install shared deps
        working-directory: shared
        run: flutter pub get

      - name: Generate shared code
        working-directory: shared
        run: dart run build_runner build --delete-conflicting-outputs

      # 动态生成客户端.env文件 - Linux
      - name: Create .env file (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: client
        run: |
          mkdir -p assets
          printf '%s\n' "${{ secrets.ENV_FILE }}" > assets/.env

      # 动态生成客户端.env文件 - Windows
      - name: Create .env file (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          @"
          ${{ secrets.ENV_FILE }}
          "@ | Out-File -FilePath assets/.env -Encoding utf8NoBOM

      # 安装并生成 client 代码
      - name: Install client deps
        working-directory: client
        run: flutter pub get

      - name: Generate client code
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      # 构建桌面应用
      - name: Build Desktop App
        working-directory: client
        run: flutter build ${{ matrix.build-cmd }} --release

      # 打包桌面应用
      - name: Package Desktop Build
        run: ${{ matrix.package-cmd }}

      # 上传产物
      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.*
  
  # 构建 Android 客户端
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v7

      # 配置 Java 环境（Android 编译必需）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
          cache-key: flutter-stable-3.47.6-android

      # 安装并生成 shared 包代码
      - name: Install shared deps
        working-directory: shared
        run: flutter pub get

      - name: Generate shared code
        working-directory: shared
        run: dart run build_runner build --delete-conflicting-outputs

      # 动态生成客户端 .env 文件
      - name: Create .env file
        working-directory: client
        run: |
          mkdir -p assets
          echo "${{ secrets.CLIENT_DOTENV }}" > assets/.env
        shell: bash

      # 安装并生成 client 代码
      - name: Install client deps
        working-directory: client
        run: flutter pub get

      - name: Generate client code
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      # 解码 keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > client/android/release-key.keystore

      # 构建分架构 APK & 签名环境变量
      - name: Build APK (split per ABI)
        working-directory: client
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/client/android/release-key.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      
      # 构建通用 APK
      - name: Build Universal APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/client/android/release-key.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      # 验证签名
      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose \
            client/build/app/outputs/flutter-apk/app-release.apk

      # 上传 Android 产物
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
            client/build/app/outputs/flutter-apk/app-release.apk
  
  # 创建Release & 上传产物
  create-release:
    runs-on: ubuntu-latest
    needs: [build-web, build-desktop, build-android]
    permissions:
      contents: write

    steps:
      # 下载 Web 产物
      - name: Download Web Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: artifacts/web/

      # 下载 Windows 桌面产物
      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: artifacts/desktop/windows-build/

      # 下载 Linux 桌面产物
      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: artifacts/desktop/linux-build/

      # 下载 Android 产物
      - name: Download Android Artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: artifacts/android/

      # 列出所有下载文件（便于排查）
      - name: List generated files
        run: |
          echo "=== Android APKs ==="
          find artifacts/android -type f | while read file; do
            echo "- $(basename "$file") - $(du -h "$file" | cut -f1)"
          done
          echo "=== Web Build ==="
          find artifacts/web -type f | while read file; do
            echo "- $(basename "$file") - $(du -h "$file" | cut -f1)"
          done
          echo "=== Desktop Builds ==="
          find artifacts/desktop -type f | while read file; do
            echo "- $(basename "$file") - $(du -h "$file" | cut -f1)"
          done

      # 创建 Release 并上传所有产物
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/web/web-build.zip
            artifacts/desktop/windows-build/windows-build.zip
            artifacts/desktop/linux-build/linux-build.tar.gz
            artifacts/android/app-armeabi-v7a-release.apk
            artifacts/android/app-arm64-v8a-release.apk
            artifacts/android/app-x86_64-release.apk
            artifacts/android/app-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Talky 构建

            ### 网页端
            - **web-build.zip** - 解压后部署到任意 Web 服务器（Nginx / Apache / 静态托管）
              - 建议开启 gzip 压缩
              - 配置 SPA 回退规则，将所有请求指向 `index.html`

            ### 桌面应用
            - **windows-build.zip** - Windows x64，解压后运行 `talky_client.exe`
            - **linux-build.tar.gz** - Linux x64，解压后运行 `talky_client`

            ### Android 应用
            - **app-armeabi-v7a-release.apk** - ARM 32 位（老旧机型）
            - **app-arm64-v8a-release.apk** - ARM 64 位（主流机型）
            - **app-x86_64-release.apk** - x86 64 位（模拟器 / 部分平板）
            - **app-release.apk** - Universal
              - 不确定设备架构时请下载该版本

            ### 部署提示
            - Web 端首次加载建议通过 Nginx 开启 gzip / brotli 压缩
            - Linux 客户端需具备 GTK3 运行环境
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}